name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python tools/publication_scan.py
      - run: python tools/run_tests.py shared
      - run: python -m build
      - run: python tools/check_artifacts.py dist
      - name: Build checksums and manifest
        shell: bash
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS)
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          assets = []
          for p in sorted(Path("dist").iterdir()):
              if p.name in {"SHA256SUMS", "release-manifest.json"}:
                  continue
              if p.is_file():
                  assets.append({
                      "name": p.name,
                      "size": p.stat().st_size,
                      "sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
                  })
          manifest = {
              "schema": 1,
              "product": "AAG - InputLock",
              "version": Path("VERSION").read_text().strip(),
              "tag": "${{ github.ref_name }}",
              "assets": assets,
          }
          Path("dist/release-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test -f "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/release-manifest.json \
            --title "AAG - InputLock ${GITHUB_REF_NAME}" \
            --notes-file "docs/RELEASE-NOTES-${GITHUB_REF_NAME}.md" \
            --prerelease
